<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — AI-Powered Job Matchmaking</title>

  <!-- React + Babel (standalone, no bundler needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- mammoth.js for .docx parsing -->
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #020817; color: #f1f5f9; }
    input[type=range] { accent-color: #6366f1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* ─── DATA ───────────────────────────────────────────────────────────── */
    const COMPANIES = [
      { id: 1,  name: "TechNova Solutions",      logo: "TN", hue: "#6366f1", domain: "Product Engineering",    skills: ["React","Node.js","TypeScript","AWS","Docker"],                  openings: 4, location: "Bangalore",  type: "Full-time", salaryMin: 8,  salaryMax: 15,  salary: "8–15 LPA",  badge: "Hiring Fast" },
      { id: 2,  name: "DataMind Analytics",      logo: "DM", hue: "#0ea5e9", domain: "Data & AI",              skills: ["Python","Machine Learning","SQL","TensorFlow","Pandas"],          openings: 3, location: "Hyderabad",  type: "Full-time", salaryMin: 10, salaryMax: 18,  salary: "10–18 LPA", badge: "Top Payer"   },
      { id: 3,  name: "CloudEdge Systems",       logo: "CE", hue: "#10b981", domain: "Cloud Infrastructure",   skills: ["AWS","Docker","Kubernetes","DevOps","Linux"],                      openings: 5, location: "Chennai",    type: "Full-time", salaryMin: 12, salaryMax: 22,  salary: "12–22 LPA", badge: "Remote OK"  },
      { id: 4,  name: "PixelCraft Studio",       logo: "PC", hue: "#f59e0b", domain: "Design & Frontend",      skills: ["Figma","React","UI/UX","CSS","JavaScript"],                        openings: 2, location: "Mumbai",     type: "Full-time", salaryMin: 7,  salaryMax: 12,  salary: "7–12 LPA",  badge: null         },
      { id: 5,  name: "MobileFusion Inc",        logo: "MF", hue: "#ec4899", domain: "Mobile Development",     skills: ["React Native","Flutter","iOS","Android","TypeScript"],             openings: 3, location: "Pune",       type: "Full-time", salaryMin: 9,  salaryMax: 16,  salary: "9–16 LPA",  badge: null         },
      { id: 6,  name: "InnovateLabs",            logo: "IL", hue: "#8b5cf6", domain: "Full Stack",             skills: ["React","Python","Django","AWS","SQL","Docker"],                    openings: 6, location: "Delhi NCR",  type: "Hybrid",    salaryMin: 10, salaryMax: 20,  salary: "10–20 LPA", badge: "Hiring Fast"},
      { id: 7,  name: "Sprints Digital",         logo: "SD", hue: "#06b6d4", domain: "Agile Consulting",       skills: ["Scrum","Agile","Project Management","Leadership","Communication"], openings: 2, location: "Kolkata",    type: "Remote",    salaryMin: 8,  salaryMax: 14,  salary: "8–14 LPA",  badge: "Remote"     },
      { id: 8,  name: "GreenStack Technologies", logo: "GT", hue: "#84cc16", domain: "Backend Engineering",    skills: ["Java","Spring Boot","SQL","Docker","Kubernetes"],                  openings: 4, location: "Bangalore",  type: "Full-time", salaryMin: 11, salaryMax: 20,  salary: "11–20 LPA", badge: null         },
      { id: 9,  name: "Quantum Circuits",        logo: "QC", hue: "#f43f5e", domain: "Embedded & IoT",         skills: ["C++","Embedded C","RTOS","IoT","Python"],                          openings: 3, location: "Pune",       type: "Full-time", salaryMin: 9,  salaryMax: 17,  salary: "9–17 LPA",  badge: "New"        },
      { id: 10, name: "NeuralPath AI",           logo: "NP", hue: "#a855f7", domain: "AI Research",            skills: ["Python","PyTorch","NLP","Computer Vision","Research"],             openings: 2, location: "Bangalore",  type: "Hybrid",    salaryMin: 18, salaryMax: 30,  salary: "18–30 LPA", badge: "Top Payer"  },
    ];

    const ALL_SKILLS = ["React","Vue","Angular","JavaScript","TypeScript","HTML","CSS","Node.js","Python","Java","Spring Boot","Django","FastAPI","Express","PHP","Go","Machine Learning","Data Science","SQL","TensorFlow","PyTorch","Pandas","R","Tableau","AWS","Azure","GCP","Docker","Kubernetes","DevOps","Linux","React Native","Flutter","iOS","Android","Figma","UI/UX","Communication","Leadership","Agile","Scrum","Project Management","C++","Embedded C","RTOS","IoT","NLP","Computer Vision","Research","Kotlin","Swift"];

    /* ─── UTILS ──────────────────────────────────────────────────────────── */
    function matchScore(cSkills, cmpSkills) {
      if (!cSkills.length || !cmpSkills.length) return 0;
      const lc = cSkills.map(s => s.toLowerCase());
      const matched = cmpSkills.filter(s => lc.includes(s.toLowerCase()));
      return Math.round((matched.length / cmpSkills.length) * 100);
    }
    function scoreColor(s) { return s >= 70 ? "#22c55e" : s >= 40 ? "#f59e0b" : "#ef4444"; }
    function scoreLabel(s) { return s >= 70 ? "Strong Match" : s >= 40 ? "Good Match" : "Partial Match"; }

    /* ─── TINY COMPONENTS ────────────────────────────────────────────────── */
    function Pill({ children, color, bg }) {
      return (
        <span style={{ display:"inline-flex", alignItems:"center", gap:4, fontSize:11, fontWeight:700, padding:"3px 9px", borderRadius:99, background: bg || color+"22", color, border:`1px solid ${color}44`, letterSpacing:.3 }}>
          {children}
        </span>
      );
    }

    function Avatar({ initials, size = 40, gradient }) {
      return (
        <div style={{ width:size, height:size, borderRadius:size*.25, background: gradient || "linear-gradient(135deg,#6366f1,#8b5cf6)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:size*.3, flexShrink:0, letterSpacing:-.5 }}>
          {initials}
        </div>
      );
    }

    function MeterBar({ score }) {
      const c = scoreColor(score);
      return (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
            <span style={{ fontSize:11, color:"#94a3b8", fontWeight:600, letterSpacing:.5, textTransform:"uppercase" }}>Match Score</span>
            <span style={{ fontSize:13, fontWeight:800, color:c }}>{score}%</span>
          </div>
          <div style={{ height:5, borderRadius:99, background:"#1e293b", overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${score}%`, background:`linear-gradient(90deg,${c}88,${c})`, borderRadius:99, transition:"width 1.2s cubic-bezier(.22,1,.36,1)" }} />
          </div>
          <div style={{ marginTop:4 }}>
            <Pill color={c}>{scoreLabel(score)}</Pill>
          </div>
        </div>
      );
    }

    /* ─── NOTIFICATION BELL ──────────────────────────────────────────────── */
    function Bell({ count }) {
      const [open, setOpen] = useState(false);
      const NOTIFS = [
        { icon:"🏢", msg:"TechNova Solutions viewed your profile", time:"2m ago" },
        { icon:"⭐", msg:"3 new match recommendations waiting", time:"15m ago" },
        { icon:"💬", msg:"DataMind Analytics sent you a message", time:"1h ago" },
        { icon:"✅", msg:"Resume analyzed — 14 skills extracted", time:"2h ago" },
      ];
      return (
        <div style={{ position:"relative" }}>
          <button onClick={() => setOpen(v=>!v)} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:10, width:38, height:38, cursor:"pointer", color:"#94a3b8", display:"flex", alignItems:"center", justifyContent:"center", position:"relative", fontSize:17 }}>
            🔔
            {count > 0 && <span style={{ position:"absolute", top:-4, right:-4, background:"#ef4444", color:"#fff", borderRadius:99, minWidth:18, height:18, fontSize:10, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, padding:"0 4px" }}>{count}</span>}
          </button>
          {open && (
            <div style={{ position:"absolute", right:0, top:46, width:310, background:"#0f172a", border:"1px solid #1e293b", borderRadius:16, boxShadow:"0 24px 60px rgba(0,0,0,.6)", zIndex:200, overflow:"hidden" }}>
              <div style={{ padding:"12px 16px 10px", borderBottom:"1px solid #1e293b", fontSize:13, fontWeight:700, color:"#f1f5f9", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                Notifications
                <span style={{ background:"#ef444422", color:"#ef4444", fontSize:10, fontWeight:800, padding:"2px 7px", borderRadius:99, border:"1px solid #ef444433" }}>{count} NEW</span>
              </div>
              {NOTIFS.map((n,i) => (
                <div key={i} style={{ padding:"11px 16px", display:"flex", gap:10, alignItems:"flex-start", borderBottom:"1px solid #1e293b11", cursor:"pointer" }}>
                  <span style={{ fontSize:20 }}>{n.icon}</span>
                  <div>
                    <p style={{ margin:0, fontSize:12.5, color:"#cbd5e1", lineHeight:1.45 }}>{n.msg}</p>
                    <p style={{ margin:"3px 0 0", fontSize:11, color:"#475569" }}>{n.time}</p>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ─── COMPANY CARD ───────────────────────────────────────────────────── */
    function CompanyCard({ company, candidateSkills, onNotify, notified, onExpand }) {
      const score = matchScore(candidateSkills, company.skills);
      const matched = company.skills.filter(s => candidateSkills.map(c=>c.toLowerCase()).includes(s.toLowerCase()));
      const isTop = score >= 70;
      return (
        <div
          style={{ background:"#0f172a", border:`1px solid ${isTop?"#22c55e33":"#1e293b"}`, borderRadius:18, padding:22, display:"flex", flexDirection:"column", gap:14, transition:"transform .2s, box-shadow .2s", cursor:"default", boxShadow: isTop ? "0 0 24px rgba(34,197,94,.08)" : "none" }}
          onMouseEnter={e => { e.currentTarget.style.transform="translateY(-3px)"; e.currentTarget.style.boxShadow=isTop?"0 8px 32px rgba(34,197,94,.15)":"0 8px 24px rgba(0,0,0,.3)"; }}
          onMouseLeave={e => { e.currentTarget.style.transform="translateY(0)"; e.currentTarget.style.boxShadow=isTop?"0 0 24px rgba(34,197,94,.08)":"none"; }}
        >
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
            <div style={{ display:"flex", gap:11, alignItems:"center" }}>
              <Avatar initials={company.logo} size={44} gradient={`linear-gradient(135deg,${company.hue},${company.hue}bb)`} />
              <div>
                <p style={{ margin:0, fontWeight:800, fontSize:14.5, color:"#f1f5f9", letterSpacing:-.2 }}>{company.name}</p>
                <p style={{ margin:0, fontSize:12, color:"#475569" }}>{company.domain}</p>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4 }}>
              {isTop && <Pill color="#22c55e">⭐ Top Match</Pill>}
              {company.badge && <Pill color={company.badge==="Top Payer"?"#f59e0b":company.badge==="Hiring Fast"?"#ef4444":"#0ea5e9"}>{company.badge}</Pill>}
            </div>
          </div>
          <MeterBar score={score} />
          <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
            {company.skills.map(s => (
              <span key={s} style={{ fontSize:11, padding:"3px 9px", borderRadius:7, fontWeight:600, background: matched.includes(s) ? "#22c55e18" : "#1e293b", color: matched.includes(s) ? "#22c55e" : "#64748b", border: `1px solid ${matched.includes(s)?"#22c55e44":"#1e293b"}` }}>
                {matched.includes(s) ? "✓ " : ""}{s}
              </span>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
            {[["📍",company.location],["💼",company.type],["💰",company.salary],["👥",`${company.openings} openings`]].map(([ic,v]) => (
              <div key={v} style={{ display:"flex", gap:5, alignItems:"center" }}>
                <span style={{ fontSize:13 }}>{ic}</span>
                <span style={{ fontSize:12, color:"#64748b" }}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => onNotify(company)} style={{ flex:1, padding:"9px 0", borderRadius:10, border: notified ? "1px solid #22c55e" : "1px solid #6366f133", background: notified ? "#22c55e18" : "#6366f111", color: notified ? "#22c55e" : "#818cf8", fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:5 }}>
              {notified ? "✓ Notified" : "🔔 Notify Company"}
            </button>
            <button onClick={() => onExpand && onExpand(company)} style={{ padding:"9px 14px", borderRadius:10, border:"1px solid #1e293b", background:"#1e293b", color:"#94a3b8", fontWeight:700, fontSize:12.5, cursor:"pointer" }}>
              Details →
            </button>
          </div>
        </div>
      );
    }

    /* ─── STAT CARD ──────────────────────────────────────────────────────── */
    function Stat({ icon, val, label, color }) {
      return (
        <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:16, padding:"18px 20px", display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ width:44, height:44, borderRadius:12, background:color+"18", border:`1px solid ${color}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>{icon}</div>
          <div>
            <p style={{ margin:0, fontSize:28, fontWeight:900, color:"#f1f5f9", lineHeight:1, letterSpacing:-1 }}>{val}</p>
            <p style={{ margin:"3px 0 0", fontSize:12, color:"#475569", letterSpacing:.3 }}>{label}</p>
          </div>
        </div>
      );
    }

    /* ─── MODAL COMPANY DETAIL ───────────────────────────────────────────── */
    function CompanyModal({ company, candidateSkills, onClose, onNotify, notified }) {
      if (!company) return null;
      const score = matchScore(candidateSkills, company.skills);
      const matched = company.skills.filter(s => candidateSkills.map(c=>c.toLowerCase()).includes(s.toLowerCase()));
      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.7)", zIndex:500, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }} onClick={onClose}>
          <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:24, maxWidth:520, width:"100%", padding:32, boxShadow:"0 40px 80px rgba(0,0,0,.6)" }} onClick={e=>e.stopPropagation()}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:24 }}>
              <div style={{ display:"flex", gap:14, alignItems:"center" }}>
                <Avatar initials={company.logo} size={52} gradient={`linear-gradient(135deg,${company.hue},${company.hue}99)`} />
                <div>
                  <p style={{ margin:0, fontWeight:900, fontSize:18, color:"#f1f5f9" }}>{company.name}</p>
                  <p style={{ margin:"2px 0 0", fontSize:13, color:"#475569" }}>{company.domain} · {company.location}</p>
                </div>
              </div>
              <button onClick={onClose} style={{ background:"#1e293b", border:"1px solid #334155", borderRadius:10, width:36, height:36, cursor:"pointer", color:"#94a3b8", fontSize:18 }}>×</button>
            </div>
            <MeterBar score={score} />
            <div style={{ margin:"20px 0 12px", fontSize:12, fontWeight:700, color:"#475569", letterSpacing:.8, textTransform:"uppercase" }}>Skill Breakdown</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
              {company.skills.map(s => (
                <span key={s} style={{ fontSize:12.5, padding:"5px 12px", borderRadius:9, fontWeight:600, background: matched.includes(s)?"#22c55e18":"#1e293b", color: matched.includes(s)?"#22c55e":"#64748b", border:`1px solid ${matched.includes(s)?"#22c55e44":"#334155"}` }}>
                  {matched.includes(s) ? "✓ " : "○ "}{s}
                </span>
              ))}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, margin:"20px 0" }}>
              {[["📍 Location",company.location],["💼 Work Type",company.type],["💰 Salary",company.salary],["👥 Openings",`${company.openings} positions`]].map(([k,v]) => (
                <div key={k} style={{ background:"#1e293b", borderRadius:10, padding:"10px 14px" }}>
                  <p style={{ margin:0, fontSize:11, color:"#475569", fontWeight:700, letterSpacing:.5, textTransform:"uppercase" }}>{k}</p>
                  <p style={{ margin:"4px 0 0", fontSize:14, color:"#cbd5e1", fontWeight:600 }}>{v}</p>
                </div>
              ))}
            </div>
            <button onClick={() => { onNotify(company); onClose(); }} style={{ width:"100%", padding:14, borderRadius:12, border:"none", background: notified ? "#22c55e22" : "linear-gradient(135deg,#6366f1,#8b5cf6)", color: notified ? "#22c55e" : "#fff", fontWeight:800, fontSize:15, cursor:"pointer" }}>
              {notified ? "✓ Company Notified" : "🔔 Notify & Express Interest"}
            </button>
          </div>
        </div>
      );
    }

    /* ─── MAIN APP ───────────────────────────────────────────────────────── */
    function SkillBridge() {
      const [view, setView]               = useState("landing");
      const [resumeText, setResumeText]   = useState("");
      const [skills, setSkills]           = useState([]);
      const [matches, setMatches]         = useState([]);
      const [loading, setLoading]         = useState(false);
      const [loadingMsg, setLoadingMsg]   = useState("");
      const [notified, setNotified]       = useState({});
      const [notifCount, setNotifCount]   = useState(3);
      const [candidateName, setName]      = useState("");
      const [aiSummary, setAiSummary]     = useState("");
      const [fileStatus, setFileStatus]   = useState(null);
      const [fileName, setFileName]       = useState("");
      const [filterScore, setFilterScore] = useState(0);
      const [tab, setTab]                 = useState("matches");
      const [searchQ, setSearchQ]         = useState("");
      const [expandedCo, setExpandedCo]   = useState(null);
      const [sortBy, setSortBy]           = useState("score");
      const [companyForm, setCompanyForm] = useState({ name:"", domain:"", email:"", skills:"" });
      const [companySubmitted, setCompanySubmitted] = useState(false);
      const fileRef = useRef();

      const STEPS = ["Reading your resume…","Extracting skills with AI…","Finding matching companies…","Scoring & ranking results…"];

      async function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setFileStatus("reading"); setFileName(file.name); setResumeText("");
        try {
          const ext = file.name.split(".").pop().toLowerCase();
          if (ext==="docx"||ext==="doc") {
            const ab = await file.arrayBuffer();
            const r = await mammoth.extractRawText({ arrayBuffer: ab });
            if (r.value?.trim().length > 20) {
              setResumeText(r.value.trim());
              setFileStatus("success");
            } else {
              setFileStatus("error");
            }
          } else if (ext==="pdf") {
            const bytes = new Uint8Array(await file.arrayBuffer());
            let raw = "";
            try { raw = new TextDecoder("utf-8", { fatal: false }).decode(bytes); } catch { raw = ""; }
            if (raw.replace(/[^\x20-\x7e]/g,"").length < 100) {
              let ascii = "";
              for (let i=0;i<bytes.length;i++) { const c=bytes[i]; if(c>=32&&c<127)ascii+=String.fromCharCode(c); else if(c===10||c===13)ascii+="\n"; }
              raw = ascii;
            }
            const btMatches = [...raw.matchAll(/BT([\s\S]{0,800}?)ET/g)].map(m=>m[1]);
            const btText = btMatches.join("\n")
              .replace(/\(([^)]+)\)/g,"$1 ")
              .replace(/[^\x20-\x7e\n]/g," ")
              .replace(/\s+/g," ").trim();
            const lines = [...new Set(
              (btText.length > 80 ? btText : raw)
                .split(/[\n\r]+/)
                .map(l=>l.replace(/[^\x20-\x7e]/g," ").replace(/\s+/g," ").trim())
                .filter(l=>l.length>3 && /[a-zA-Z]{2,}/.test(l) && !/^[\d\s\W]+$/.test(l))
            )];
            const cleaned = lines.join("\n");
            if (cleaned.length > 80) {
              setResumeText(cleaned); setFileStatus("success");
            } else {
              setFileStatus("pdf_warn");
            }
          } else if (ext==="txt") {
            const reader = new FileReader();
            reader.onload = ev => { setResumeText(ev.target.result); setFileStatus("success"); };
            reader.onerror = () => setFileStatus("error");
            reader.readAsText(file);
          } else { setFileStatus("error"); }
        } catch { setFileStatus("error"); }
      }

      async function analyze() {
        if (!resumeText.trim()) return;
        setLoading(true);
        for (let i=0;i<STEPS.length;i++) { setLoadingMsg(STEPS[i]); await new Promise(r=>setTimeout(r,750)); }
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              model:"claude-sonnet-4-20250514", max_tokens:1000,
              messages:[{ role:"user", content:`Extract skills from this resume. Return ONLY a JSON object:
{"name":"full name or 'Candidate'","skills":["skill1","skill2",...],"summary":"2-sentence professional summary","level":"Fresher/Junior/Mid-level/Senior"}
Resume:
${resumeText}
Return ONLY the JSON, no markdown.` }]
            })
          });
          const data = await res.json();
          const parsed = JSON.parse(data.content[0].text.replace(/```json|```/g,"").trim());
          const extracted = parsed.skills || [];
          if (extracted.length === 0) {
            const fallback = [...new Set(ALL_SKILLS.filter(s=>resumeText.toLowerCase().includes(s.toLowerCase())))].slice(0,14);
            if (fallback.length === 0) { setLoading(false); setFileStatus("no_skills"); return; }
            setSkills(fallback); setName(parsed.name || "Candidate"); setAiSummary("");
            setMatches(COMPANIES.map(c=>({...c, score: matchScore(fallback, c.skills)})).sort((a,b)=>b.score-a.score));
            setView("dashboard"); setNotifCount(n=>n+1);
          } else {
            setName(parsed.name || "Candidate");
            setSkills(extracted);
            setAiSummary(parsed.summary || "");
            setMatches(COMPANIES.map(c=>({...c, score: matchScore(extracted, c.skills)})).sort((a,b)=>b.score-a.score));
            setView("dashboard"); setNotifCount(n=>n+1);
          }
        } catch {
          const fallback = [...new Set(ALL_SKILLS.filter(s=>resumeText.toLowerCase().includes(s.toLowerCase())))].slice(0,14);
          if (fallback.length === 0) { setLoading(false); setFileStatus("no_skills"); return; }
          setSkills(fallback); setName("Candidate");
          setMatches(COMPANIES.map(c=>({...c, score: matchScore(fallback, c.skills)})).sort((a,b)=>b.score-a.score));
          setView("dashboard");
        }
        setLoading(false);
      }

      function notify(company) {
        setNotified(prev=>({...prev,[company.id]:true}));
        setNotifCount(n=>n+1);
      }

      let displayed = [...matches].filter(m => m.score >= filterScore);
      if (searchQ) displayed = displayed.filter(m =>
        m.name.toLowerCase().includes(searchQ.toLowerCase()) ||
        m.domain.toLowerCase().includes(searchQ.toLowerCase()) ||
        m.skills.some(s=>s.toLowerCase().includes(searchQ.toLowerCase()))
      );
      if (tab==="top") displayed = displayed.filter(m => m.score >= 70);
      if (sortBy==="name") displayed.sort((a,b)=>a.name.localeCompare(b.name));

                        value={companyForm[f.key]}
                        onChange={e=>setCompanyForm(prev=>({...prev,[f.key]:e.target.value}))}
                        style={{ padding:"12px 16px", background:"rgba(255,255,255,.05)", border:"1px solid rgba(255,255,255,.1)", borderRadius:10, color:"#f1f5f9", fontSize:14, fontFamily:"inherit", transition:"border-color .2s" }}
                      />
                    ))}
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <button
                      onClick={()=>{ if(companyForm.name&&companyForm.email) setCompanySubmitted(true); }}
                      disabled={!companyForm.name||!companyForm.email}
                      style={{ background: companyForm.name&&companyForm.email ? "linear-gradient(135deg,#6366f1,#8b5cf6)" : "#1e293b", border:"none", color: companyForm.name&&companyForm.email ? "#fff" : "#334155", padding:"14px 36px", borderRadius:12, cursor: companyForm.name&&companyForm.email ? "pointer" : "not-allowed", fontWeight:800, fontSize:15 }}
                    >
                      Request Access →
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );

      /* ── DASHBOARD ── */
      return (
        <div style={{ minHeight:"100vh", background:"#020817", fontFamily:"'DM Sans','Segoe UI',system-ui,sans-serif", color:"#f1f5f9" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
            @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
            .tab-btn:hover{background:rgba(255,255,255,.06)!important;}
            input[type=range]{accent-color:#6366f1;}
            @media(max-width:900px){
              .dash-grid{grid-template-columns:1fr!important;}
              .dash-sidebar{display:none;}
              .dash-mobile-top{display:flex!important;}
            }
            @media(max-width:640px){
              .dash-stats{grid-template-columns:1fr 1fr!important;}
              .dash-cards{grid-template-columns:1fr!important;}
              .dash-topbar{flex-direction:column;align-items:stretch!important;}
              .dash-search{width:100%!important;}
            }
          `}</style>
          <nav style={{ background:"rgba(255,255,255,.02)", borderBottom:"1px solid #1e293b", padding:"0 28px", display:"flex", justifyContent:"space-between", alignItems:"center", height:60 }}>
            <button onClick={()=>setView("landing")} style={{ display:"flex", alignItems:"center", gap:8, background:"none", border:"none", cursor:"pointer", color:"#f1f5f9", fontWeight:800, fontSize:17 }}>
              <div style={{ width:30, height:30, background:"linear-gradient(135deg,#6366f1,#8b5cf6)", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontSize:15 }}>⬡</div>
              SkillBridge
            </button>
            <div style={{ display:"flex", gap:12, alignItems:"center" }}>
              <Bell count={notifCount} />
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <Avatar initials={candidateName.charAt(0)||"C"} size={34} gradient="linear-gradient(135deg,#818cf8,#34d399)" />
                <span style={{ color:"#94a3b8", fontSize:14, fontWeight:600 }}>{candidateName}</span>
              </div>
            </div>
          </nav>
          <div style={{ maxWidth:1220, margin:"0 auto", padding:"28px 20px" }}>
            <div style={{ background:"linear-gradient(135deg,rgba(99,102,241,.12),rgba(16,185,129,.08))", border:"1px solid rgba(99,102,241,.2)", borderRadius:18, padding:"20px 28px", marginBottom:24, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12, animation:"fadeIn .5s ease" }}>
              <div>
                <h2 style={{ margin:"0 0 4px", fontSize:22, fontWeight:900, letterSpacing:-.5 }}>Welcome back, {candidateName}! 👋</h2>
                <p style={{ margin:0, color:"#475569", fontSize:14 }}>Your resume was analyzed and {matches.length} companies were scored.</p>
              </div>
              {aiSummary && <div style={{ background:"rgba(255,255,255,.04)", border:"1px solid #1e293b", borderRadius:12, padding:"10px 16px", maxWidth:380, fontSize:13, color:"#94a3b8", lineHeight:1.6 }}>✨ {aiSummary}</div>}
            </div>
            <div className="dash-stats" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:24 }}>
              <Stat icon="💡" val={skills.length}                    label="Skills Extracted"     color="#6366f1" />
              <Stat icon="🏢" val={matches.length}                   label="Companies Scored"     color="#0ea5e9" />
              <Stat icon="⭐" val={topCount}                         label="Strong Matches (70%+)" color="#22c55e" />
              <Stat icon="🔔" val={Object.keys(notified).length}     label="Companies Notified"   color="#f59e0b" />
            </div>
            <div className="dash-grid" style={{ display:"grid", gridTemplateColumns:"280px 1fr", gap:20, alignItems:"start" }}>
              <div className="dash-sidebar" style={{ display:"flex", flexDirection:"column", gap:16 }}>
                <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:16, padding:22 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                    <h3 style={{ margin:0, fontSize:15, fontWeight:800, color:"#f1f5f9" }}>Your Skills</h3>
                    <span style={{ background:"#6366f118", color:"#818cf8", fontSize:12, fontWeight:800, padding:"2px 9px", borderRadius:99, border:"1px solid #6366f133" }}>{skills.length}</span>
                  </div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                    {skills.map(s=>(
                      <span key={s} style={{ background:"linear-gradient(135deg,#1e1b4b,#1e293b)", color:"#a5b4fc", fontSize:12, fontWeight:700, padding:"5px 11px", borderRadius:8, border:"1px solid #312e81" }}>{s}</span>
                    ))}
                  </div>
                </div>
                <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:16, padding:22 }}>
                  <h3 style={{ margin:"0 0 16px", fontSize:15, fontWeight:800, color:"#f1f5f9" }}>Filters & Sort</h3>
                  <label style={{ fontSize:12, color:"#475569", fontWeight:700, letterSpacing:.5, textTransform:"uppercase", display:"block", marginBottom:8 }}>
                    Min Match Score: <strong style={{ color:"#f1f5f9" }}>{filterScore}%</strong>
                  </label>
                  <input type="range" min="0" max="80" step="10" value={filterScore} onChange={e=>setFilterScore(+e.target.value)} style={{ width:"100%", marginBottom:6 }} />
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"#334155", marginBottom:16 }}><span>All</span><span>Strong only</span></div>
                  <label style={{ fontSize:12, color:"#475569", fontWeight:700, letterSpacing:.5, textTransform:"uppercase", display:"block", marginBottom:8 }}>Sort By</label>
                  <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                    {[["score","Best Match"],["name","Company Name"],["salary","Salary"]].map(([v,l])=>(
                      <button key={v} onClick={()=>setSortBy(v)} className="tab-btn" style={{ padding:"8px 12px", borderRadius:9, border:`1px solid ${sortBy===v?"#6366f133":"#1e293b"}`, background: sortBy===v?"rgba(99,102,241,.12)":"transparent", color: sortBy===v?"#818cf8":"#475569", fontWeight:700, fontSize:13, cursor:"pointer", textAlign:"left" }}>
                        {sortBy===v?"● ":"○ "}{l}
                      </button>
                    ))}
                  </div>
                </div>
                <button onClick={()=>{ setView("upload"); setFileStatus(null); setFileName(""); setResumeText(""); }} style={{ background:"linear-gradient(135deg,#6366f1,#8b5cf6)", border:"none", color:"#fff", padding:"13px 0", borderRadius:12, cursor:"pointer", fontWeight:800, fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  🔄 Upload New Resume
                </button>
              </div>
              <div>
                <div className="dash-topbar" style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18, flexWrap:"wrap", gap:10 }}>
                  <div style={{ display:"flex", gap:0, background:"#0f172a", border:"1px solid #1e293b", borderRadius:12, overflow:"hidden" }}>
                    {[["matches",`All (${displayed.length})`],["top",`Top Matches (${topCount})`]].map(([v,l])=>(
                      <button key={v} onClick={()=>setTab(v)} style={{ padding:"9px 18px", border:"none", background: tab===v?"linear-gradient(135deg,#6366f1,#8b5cf6)":"transparent", color: tab===v?"#fff":"#64748b", fontWeight:700, fontSize:13.5, cursor:"pointer" }}>{l}</button>
                    ))}
                  </div>
                  <input
                    className="dash-search"
                    value={searchQ}
                    onChange={e=>setSearchQ(e.target.value)}
                    placeholder="🔍  Search companies, skills…"
                    style={{ padding:"9px 14px", background:"#0f172a", border:"1px solid #1e293b", borderRadius:10, color:"#f1f5f9", fontSize:13.5, outline:"none", fontFamily:"inherit", width:220 }}
                  />
                </div>
                <div className="dash-cards" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))", gap:16, animation:"fadeIn .4s ease" }}>
                  {displayed.map(company=>(
                    <CompanyCard key={company.id} company={company} candidateSkills={skills} onNotify={notify} notified={!!notified[company.id]} onExpand={setExpandedCo} />
                  ))}
                </div>
                {displayed.length===0 && (
                  <div style={{ textAlign:"center", padding:"70px 20px", color:"#334155" }}>
                    <div style={{ fontSize:52, marginBottom:14 }}>🔍</div>
                    <p style={{ fontSize:17, margin:0, fontWeight:700, color:"#475569" }}>No matches at this filter level</p>
                    <p style={{ fontSize:14, margin:"8px 0 0", color:"#334155" }}>Try lowering the minimum score or clearing the search.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
          <CompanyModal company={expandedCo} candidateSkills={skills} onClose={()=>setExpandedCo(null)} onNotify={notify} notified={expandedCo ? !!notified[expandedCo.id] : false} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SkillBridge />);
  </script>
</body>
</html>
